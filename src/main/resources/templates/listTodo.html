<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Danh sách To-do</title></head>
<body>
<h1>Việc cần làm:</h1>
<ul>
    <li th:each="todo : ${todoList}">
        <span th:text="${todo.title}"></span> : <span th:text="${todo.detail}"></span>
    </li>
</ul>
<a href="/addTodo">+ Thêm mới</a>
</body>
</html>
