<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Loda To-do</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>

    <link th:href="@{/css/bootstrap.css}" rel="stylesheet"/>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>

    <script th:src="@{/js/bootstrap.js}"></script>
</head>
<body>
<h1>To-do</h1>

<form th:action="@{/addTodo}" th:object="${todo}" method="post">
    <p>Title: <input type="text" th:field="*{title}" class="form-control"/></p>
    <p>Detail: <input type="text" th:field="*{detail}" class="form-control"/></p>

    <p><button type="submit" class="btn btn-success">Add</button></p>
</form>
</body>
</html>
